# mihomo rule-providers 片段（不含主配置里的端口、密钥或节点）。
# 仓库按 nibs-taut9m/mihomo-rules、分支 main 填写；若仓库名或默认分支不同，请替换 URL。
# 混合了域名和 IP 的组使用 classical YAML，因为 mrs 不支持 classical。
# 纯域名或纯 IP 的组（含公共 geo 备份）使用 mrs。
# 同组若使用 mrs，请同时引用 domain/组名.mrs 与 ipcidr/组名.mrs。
# copilot 必须在 github 之前。

rule-providers:
  stun-webrtc:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/nibs-taut9m/mihomo-rules/main/domain/stun-webrtc.mrs
    path: "./rule_provider/stun_webrtc"

  ads-trackers:
