# 常见被墙软件/服务的实用子集，不是完整 GFWList，也不是 geosite:gfw 的替代品。
# 已在对应公司文件中收录的服务（GitHub/npm、Steam、Skype、LinkedIn、Blogger、各点名应用等）不在本组重复。
