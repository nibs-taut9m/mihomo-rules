#   copilot.yaml（Microsoft Copilot / GitHub Copilot 专用域）、
#   github.yaml（GitHub 平台与 npm，含官方 /meta 服务目的地址）、
#   onedrive.yaml（OneDrive 专用域）、
#   microsoft-cn.yaml（21Vianet / 中国区官方域与中国区服务 IP）。
