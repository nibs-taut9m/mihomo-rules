# 仅写入官方文档中的具体 Azure/Windows 主机（如 login.windows.net）。
# 未整包收录 Activision/Blizzard/King/Bethesda；收录 Xbox/Game Pass 与 Minecraft/Mojang 官方域。
# bat.bing.com / ads.microsoft.com 等广告像素见 ads-trackers.yaml（REJECT 优先）。
# sharepoint.com / sharepointonline.com 保留在本组（SharePoint 站点集合）；OneDrive 个人库形态见 onedrive.yaml。
# 抓取日期：2026-11-14（America/Los_Angeles）。
