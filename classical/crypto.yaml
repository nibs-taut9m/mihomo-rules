# mihomo / Clash Meta rule-provider: 主流加密货币交易所与相关官方产品域（crypto）
# 完整的加密货币分流组：包含 Binance、Gate 以及 Coinbase、Kraken、OKX、Bybit、Bitget、
# Crypto.com、Gemini、KuCoin、HTX、MEXC、Bitfinex、Deribit、Bitstamp、BitMEX，
# 还有官方行情站 CoinGecko、CoinMarketCap。
# 各域均为对应产品的官方主站（或官方仍在使用的品牌域名，如 OKX 的 okex.com、HTX 的 huobi.com）。
# binance.us 是独立运营的美国主体，不属于 binance.com，但作为主流官方交易所收录在本组。
# 更细的公司文件见 gate.yaml、binance.yaml，其中的根域也会出现在本组。
# 若希望 Gate / Binance 使用与其他交易所不同的策略，请把那两个文件排在本文件之前（先匹配优先）。
# 未发现这些交易所公布的、适合客户端分流的稳定官方 IP/CIDR，故仅域名；不编造 ASN 或云上客户地址。
# 未收录非官方镜像、仿冒站或未核实的地区镜像域。
# 抓取日期：2026-11-14（America/Los_Angeles）。
