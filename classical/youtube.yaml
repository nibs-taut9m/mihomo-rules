# mihomo / Clash Meta rule-provider: YouTube
# 官方 YouTube 产品域，便于与其余 Google 服务使用不同策略。
# 核心域包括 youtube.com、youtu.be、youtube-nocookie.com、googlevideo.com、ytimg.com、
# youtubeeducation.com、youtubekids.com、youtubei.googleapis.com 等。
# 国家和地区站点（youtube.co.uk、youtube.de 等，并不都是 youtube.com 的子域）交叉核对于
# v2fly domain-list-community 的 youtube 列表：https://github.com/v2fly/domain-list-community
# 精确主机 wide-youtube.l.google.com、youtube-ui.l.google.com、yt3.googleusercontent.com
# 用于命中不在 youtube.com 后缀下的官方前端 / 头像主机，而不把整个 google.com 或 googleusercontent.com 算进来。
# 未收录 ggpht.com、gvt1.com 等与其他 Google 产品共用的域，它们留在 google.yaml。
# 可分离的广告统计域见 ads-trackers.yaml；STUN 见 stun-webrtc.yaml。
# YouTube 没有可与 Google 默认地址空间干净分离的官方专用 IP：goog.json 减 cloud.json 的结果留在 google.yaml。
# 按域名匹配的播放请求会先被本组命中（请将本文件排在 google.yaml 之前）。
# 抓取日期：2026-11-14（America/Los_Angeles）。
