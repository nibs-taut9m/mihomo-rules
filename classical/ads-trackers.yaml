# mihomo / Clash Meta rule-provider: 主流广告与追踪（建议 RULE-SET → REJECT，紧随 stun-webrtc 之后、各应用 PROXY 之前）
# 高质量可维护集：以主流广告网络、数据经纪、MMP、分析像素的公司根域为主。
# 交叉核对：v2fly category-ads / category-ads-all、Peter Lowe 广告主机列表的公司根域，只收录能确认的网络，不是 10 万条子域转储。
# 刻意不收录：facebook.com / facebook.net / instagram.com（Meta 应用依赖，留在 meta.yaml）；
# google.com（搜索本体，留在 google.yaml）、youtube.com（视频本体，留在 youtube.yaml）；
# sentry.io / datadog / intercom / stripe（ChatGPT 官方 allowlist 依赖，全局拒绝会打断客户端）。
# 对位于第一方根域下的像素使用精确后缀（如 ads.tiktok.com、bat.bing.com、analytics.twitter.com），
# 这样 REJECT 优先命中像素，而不必拒绝整个 tiktok.com / bing.com / twitter.com。
# OneTrust 等同意管理平台未收录，以免大面积破坏 cookie 横幅。
# 抓取日期：2026-11-14（America/Los_Angeles）。
