# mihomo / Clash Meta rule-provider: GitHub（含 npm）
# GitHub 平台（网站、Git、Pages、Packages/GHCR、Actions 产物存储等）以及 GitHub 旗下的 npm 注册表。
# GitHub Copilot 专用主机仍在 copilot.yaml；请把 copilot 排在本文件之前，
# 以免 copilot-proxy.githubusercontent.com 等被本文件的后缀规则抢先匹配。
# IP：仅使用 GitHub 官方 https://api.github.com/meta 中的服务目的地址
#   （hooks、web、api、git、pages、packages、importer、github_enterprise_importer、shared_ingress），已聚合。
# 明确不收录：Actions / Actions macOS / Codespaces 托管 runner 地址池
#   （这些是 runner 出口池，体量接近整块 Azure，不是客户端要连接的目的地址）。
# 也不写入 /meta 的 copilot IP 列表（与主站地址块重叠；Copilot 专用域见 copilot.yaml）。
# 不收录 GitLab / Gitee / GitBook，也不使用过宽的 DOMAIN-KEYWORD,github。
# Azure Blob 只写官方 /meta 公布的具体存储账户，不用 *.blob.core.windows.net 通配。
# 还包括可在 QuixoticHeart/rule-set 的 meta/gits.list 中核验的官方产品域。
# 抓取日期：2026-11-14（America/Los_Angeles）。
