# mihomo / Clash Meta rule-provider: Apple 中国大陆可直连（apple-cn）
# “-cn” 表示在中国大陆不必开代理即可访问的服务，默认策略为 DIRECT（见 config-snippet.yaml）。
# 本文件须排在 apple.yaml 之前，以便这些主机走直连而不是兜底 PROXY。
#
# 来源：
#   - Apple 101555：https://support.apple.com/en-us/101555
#     将 *.icloud.com.cn、*.apzones.com 标明为 “iCloud services in China”；
#     https://www.apple.com.cn/ 为 Apple 中国大陆官方网站。
#   - 交叉核对于 https://github.com/QuixoticHeart/rule-set 的 meta/apple-cn.list（规则源为
#     felixonmars/dnsmasq-china-list 的 apple.china.conf 与 SukkaW/Surge）。
#     对照文件还有 meta/apple-proxy.list（中国大陆需要代理的 Apple 服务，不写入本组）。
#
# 收录范围：
#   1) 中国大陆专属官方域与主机（.cn、apzones.com、*-cn.apple.com、cdn-cn*.apple-mapkit.com、
#      上海/天津 SMP 节点、mesu-china / support-china 等）；
#   2) 软件更新、设备配置与 PKI 端点：它们同时出现在 QH apple-cn 与 Apple 101555
#      （Software updates / Device management / Certificates），且不在 QH apple-proxy 中。
#      这些主机名是全球通用的，但在中国大陆可直连；写入本组是为了让更新/证书校验走 DIRECT。
#
# 明确不收录（避免把全球流量提前打进 DIRECT，或抢走应走 PROXY 的分组）：
#   - www.apple.com、store.apple.com、support.apple.com、music.apple.com、
#     itunes.apple.com、apps.apple.com、itunesconnect.apple.com（全球入口；
#     apps/itunes 也出现在 QH apple-proxy，会与 TV+ / 国际店面冲突）；
#   - 未带 cn 的 MapKit / mzstatic / 全球 CDN 通配；
#   - Siri / Apple Intelligence / Private Relay / APNs 主机（分属 apple-intelligence、
#     apple-private-relay、apns，且排在本组之前，保持 PROXY）；
#   - QH 中的探测域 7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe；
#   - ocsp.apple.com（同时出现在 apple-proxy，不写入以免策略冲突）。
# 101555 列出的 ocsp.digicert.cn 属于 DigiCert，不是 Apple 自有域，不收录。
# 未使用 Private Relay 出口地址表。本组以域名为主。
# 抓取日期：2026-11-14（America/Los_Angeles）。
payload:
  # 官方中国大陆专属域
  - DOMAIN-SUFFIX,apple.com.cn
  - DOMAIN-SUFFIX,icloud.com.cn
  - DOMAIN-SUFFIX,apzones.com
  - DOMAIN-SUFFIX,cn.apple.com
  # 中国大陆专用搜索 / Siri 入口（与全球 smoot.apple.com 分开，便于直连）
  - DOMAIN,api.smoot.apple.cn
  # 中国大陆专用 CDN、定位、地图、支付与设备节点
  - DOMAIN-SUFFIX,cdn-cn1.apple-mapkit.com
  - DOMAIN-SUFFIX,cdn-cn2.apple-mapkit.com
