# mihomo / Clash Meta rule-provider: Microsoft 中国大陆可直连（microsoft-cn）
# “-cn” 表示在中国大陆不必开代理即可访问的服务，默认策略为 DIRECT（见 config-snippet.yaml）。
# 本文件须排在 microsoft.yaml 之前，以便这些主机走直连而不是兜底 PROXY。
#
# 官方来源：https://endpoints.office.com/endpoints/China
#   文档：https://learn.microsoft.com/en-us/microsoft-365/enterprise/urls-and-ip-address-ranges-21vianet
# 保留该接口公布的中国区特有域名（partner.outlook.cn、microsoftonline.cn、sharepoint.cn、sovcloud.cn 等）
# 以及官方中国区服务 IP。
# 还包括可在 https://github.com/QuixoticHeart/rule-set 的 meta/microsoft-cn.list
# （ruleset 6864f3e1116f，2026-11-14）中核验的官方域，如 21Vianet 品牌域、outlook.cn / office365.cn /
# Microsoft 中国商店与文档、Bing 中国主机（cn.bing.com、bing.com.cn、bj1.api.bing.com）、
# xboxlive.cn，以及 mschcdn / mcchcdn / azchcdn* 等中国 CDN 别名。
#
# 明确不收录（避免把全球流量提前打进 DIRECT，或误伤 Azure 中国客户应用）：
#   - login.microsoftonline.com、officecdn.microsoft.com、*.cdn.office.net、
#     download.microsoft.com、developer.microsoft.com、download.windowsupdate.com、
#     dl.delivery.mp.microsoft.com、ctldl.windowsupdate.com、shell.cdn.office.net 等全球共享主机；
#   - 过宽的 Azure 中国通配：*.windowsazure.cn、*.chinacloudapi.cn、*.azure-mobile.cn、
#     *.chinacloud-mobile.cn、*.chinacloudapp.cn、*.chinacloudsites.cn、*.azure.cn、
#     *.trafficmanager.cn、*.appserviceenvironment.cn。
#   仍保留官方列表中的具体主机 microsoftgraph.chinacloudapi.cn、collector.azure.cn。
# 抓取日期：2026-11-14（America/Los_Angeles）。
